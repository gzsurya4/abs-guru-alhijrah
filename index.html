function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function compressFile(file, max, q, png, square) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url);
    let sx = 0, sy = 0, sw = img.width, sh = img.height;
    if (square) { const s = Math.min(sw, sh); sx = (sw - s) / 2; sy = (sh - s) / 2; sw = s; sh = s; }
    const sc = Math.min(1, max / Math.max(sw, sh));
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(sw * sc)); c.height = Math.max(1, Math.round(sh * sc));
    c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
    let out = png ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', q);
    if (png && out.length > 180000) out = c.toDataURL('image/jpeg', q);
    return out;
  } finally { URL.revokeObjectURL(url); }
}

function evalDay(u, ds, rec, izins, cfg, now = new Date(), bds = []) {
  const today = ymd(now);

  const kerja = cfg.hariKerja.includes(dateOf(ds).getDay()) && !isLibur(cfg, ds);
  const iz = izinOn(izins, ds);
  if (!rec && !kerja && !iz) return null;

function summarize(rows) {

}

let stream = null, A = {};
async function startCam() {

function stopCam() { faceStop(); if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
/* ---- deteksi wajah (MediaPipe Face Detector, berjalan di perangkat) ---- */
const MP_VER = '0.10.14', MP_BASE = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite';
let faceDet = null, faceLoading = null, faceTimer = 0, faceOk = false;
function loadFace() {
  if (faceDet) return Promise.resolve(faceDet);
  if (!faceLoading) faceLoading = (async () => {
    const m = await import(`${MP_BASE}/vision_bundle.mjs`), fs = await m.FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
    const mk = delegate => m.FaceDetector.createFromOptions(fs, { baseOptions: { modelAssetPath: FACE_MODEL, delegate }, runningMode: 'IMAGE', minDetectionConfidence: 0.6 });
    try { faceDet = await mk('GPU'); } catch (e) { faceDet = await mk('CPU'); }
    return faceDet;
  })().catch(e => { faceLoading = null; throw new Error('Pendeteksi wajah gagal dimuat. Periksa koneksi internet lalu coba lagi.'); });
  return faceLoading;
}
// jumlah wajah yang jelas terlihat (cukup besar & yakin) pada video/kanvas
function countFaces(src) {
  const W = src.videoWidth || src.width, r = faceDet.detect(src);
  return (r.detections || []).filter(d => (d.categories?.[0]?.score ?? 1) >= 0.6 && d.boundingBox && d.boundingBox.width >= W * 0.18).length;
}
const FACE_MSG = { 0: 'Wajah tidak terdeteksi. Hadapkan wajah ke kamera, pastikan cahaya cukup, lalu ambil foto ulang.', 2: 'Terdeteksi lebih dari satu wajah. Foto selfie harus hanya berisi wajah Anda.' };
function faceStop() { clearTimeout(faceTimer); faceTimer = 0; }
function faceWatch() {   // pantau wajah selama kamera aktif, tombol Ambil Foto aktif hanya bila ada wajah
  faceStop();
  const loop = () => {
    const v = $('#cam'), hint = $('#faceHint'), btn = $('#btnSnap');
    if (!stream || !v || v.hidden || !hint) return;
    let n = 0; try { n = v.videoWidth ? countFaces(v) : 0; } catch (e) { n = 0; }
    faceOk = n === 1;
    hint.className = 'facehint ' + (faceOk ? 'ok' : 'bad'); hint.textContent = faceOk ? 'Wajah terdeteksi. Silakan ambil foto.' : (n > 1 ? FACE_MSG[2] : 'Wajah belum terdeteksi. Hadapkan wajah ke kamera.');
    if (btn) btn.disabled = !faceOk;
    faceTimer = setTimeout(loop, 500);
  };
  loop();
}
function grabFrame() {
  const v = $('#cam'); if (!v.videoWidth) throw new Error('Kamera belum siap.');
  const w = 480, h = Math.round(w * v.videoHeight / v.videoWidth);
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  x.translate(w, 0); x.scale(-1, 1); x.drawImage(v, 0, 0, w, h); x.setTransform(1, 0, 0, 1, 0, 0);
  return c;
}
function stampPhoto(c) {
  const x = c.getContext('2d'), w = c.width, h = c.height, d = new Date();
  x.fillStyle = 'rgba(0,0,0,.5)'; x.fillRect(0, h - 28, w, 28); x.fillStyle = '#fff'; x.font = '13px sans-serif';

function getPos() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('Perangkat tidak mendukung GPS.'));
    navigator.geolocation.getCurrentPosition(p => res(p.coords), e => rej(new Error(e.code === 1 ? 'Izin lokasi ditolak. Aktifkan izin lokasi di pengaturan browser.' : e.code === 2 ? 'Lokasi tidak tersedia. Aktifkan GPS Anda.' : 'Pencarian lokasi melebihi batas waktu. Coba lagi.')), { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });

actions.sendAbsen = async () => {
  if (A.sending) return;
  const cfg = cfgOrDefault(), u = S.user, now = new Date(), today = ymd(now), mins = now.getHours() * 60 + now.getMinutes();
  const w = windowState(A.mode, cfg, now); if (!w.open) return toast(w.msg, 'err');
  if (A.emode === 'sekolah' && (!A.pos || A.jarak > cfg.radius)) return toast('Anda berada di luar area absensi.', 'err');
  if (!A.foto) return toast('Ambil foto selfie terlebih dahulu.', 'err');
  A.sending = true; updateSend(); busy(true);
  try {
    const id = `${today}_${u.username}`, cur = await DB.getAbsensi(id), sk = A.emode === 'sekolah';
    const rec = { waktu: hm(now), iso: now.toISOString(), lat: sk ? +A.pos.latitude.toFixed(6) : 0, lng: sk ? +A.pos.longitude.toFixed(6) : 0, jarak: sk ? Math.round(A.jarak) : 0, akurasi: sk ? Math.round(A.pos.accuracy || 0) : 0, status: '', foto: A.foto, mode: A.emode };
    let poin = 0, ket = '';
    if (A.mode === 'masuk') {
      if (cur) throw new Error('Anda sudah absen masuk hari ini.');
      const late = mins > toMin(cfg.jamMasukBatas) + Number(cfg.toleransiMenit || 0);
      rec.status = late ? 'Terlambat' : 'Tepat Waktu'; rec.terlambatMenit = late ? mins - toMin(cfg.jamMasukBatas) : 0;
      await DB.createAbsensi(id, { username: u.username, nama: u.nama, tanggal: today, masuk: rec });
      if (late && !A.dinas) { poin = Math.min(Math.round(rec.terlambatMenit * cfg.poinPerMenit), cfg.poinTelatMax); ket = `Terlambat ${rec.terlambatMenit} menit`; }
    } else {
      rec.status = 'Tepat Waktu';
      if (A.tanpaMasuk) {
        if (cur) throw new Error('Data absensi sudah ada. Muat ulang halaman.');
        await DB.createPulangOnly(id, { username: u.username, nama: u.nama, tanggal: today, pulang: rec });
        if (!A.dinas) { poin = cfg.poinTelatMax; ket = 'Tidak absen masuk'; }
      } else {
        if (!cur || !cur.masuk || cur.pulang) throw new Error('Data absen pulang tidak valid atau sudah tercatat.');
        await DB.updateAbsensi(id, { pulang: rec });
      }
    }
    S.cache = {}; stopCam();
    modal('Absen Berhasil', `<div class="center"><div style="font-size:44px;color:var(--ok)">✓</div><h3>Absen ${A.mode === 'masuk' ? 'masuk' : 'pulang'} tercatat</h3><p class="mut" style="margin:6px 0 10px">Pukul ${esc(rec.waktu)} · ${chip(rec.status)}</p>${poin ? `<p class="notice" style="justify-content:center">${esc(ket)}: <b>+${poin} poin tanpa keterangan</b></p>` : ''}<button class="btn pri block" data-act="doneAbsen">Selesai</button></div>`);
  } catch (e) { toast(errMsg(e), 'err'); }
  finally { A.sending = false; busy(false); updateSend(); }
};

const STACK = [['pTelat', 'Terlambat', '#f59e0b'], ['pPulang', 'Tidak absen pulang', '#60a5fa'], ['pMasuk', 'Tidak absen masuk', '#fb923c'], ['pAlpha', 'Alpha', '#ef4444']];
const legendHtml = items => `<div class="legend">${items.map(([t, c]) => `<span style="--c:${c}">${esc(t)}</span>`).join('')}</div>`;

function chartTopPoin(perGuru, n = 10) {
  const list = perGuru.filter(g => g.sum.poin > 0).sort((a, b) => b.sum.poin - a.sum.poin).slice(0, n);
  if (!list.length) return emptyBox('Belum ada poin tanpa keterangan pada periode ini.', 'chart');
  const max = list[0].sum.poin;
  return `${legendHtml(STACK.map(([, t, c]) => [t, c]))}<div style="height:12px"></div>` + list.map(g => `<div class="hb"><div class="hb-h"><span>${esc(g.u.nama)}</span><b>${g.sum.poin} poin · ${rp(potong(g.sum.poin, cfgOrDefault()))}</b></div><div class="hb-bar" role="img" aria-label="${esc(g.u.nama)}: ${g.sum.poin} poin">${STACK.map(([k, t, c]) => g.sum[k] ? `<i title="${esc(t)}: ${g.sum[k]}" style="width:${g.sum[k] / max * 100}%;background:${c}"></i>` : '').join('')}</div></div>`).join('');
}
function chartDonut(parts) {
  const tot = parts.reduce((a, p) => a + p.v, 0);
  if (!tot) return emptyBox('Belum ada data pada periode ini.', 'chart');
  const R = 54, C = 2 * Math.PI * R; let off = 0;
  const arcs = parts.filter(p => p.v > 0).map(p => { const len = p.v / tot * C, s = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${p.c}" stroke-width="22" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"><title>${esc(p.t)}: ${p.v}</title></circle>`; off += len; return s; }).join('');
  return `<div class="donutwrap"><svg width="150" height="150" viewBox="0 0 140 140" role="img" aria-label="Komposisi kehadiran">${arcs}<text x="70" y="68" text-anchor="middle" font-size="22" font-weight="800" fill="#1f2937">${tot}</text><text x="70" y="85" text-anchor="middle" font-size="10" fill="#6b7280">hari-guru</text></svg><div class="legend">${parts.map(p => `<span style="--c:${p.c}">${esc(p.t)}: <b>${p.v}</b> (${Math.round(p.v / tot * 100)}%)</span>`).join('')}</div></div>`;
}
function chartDaily(mat) {
  const data = mat.days.filter(ds => (mat.byDate[ds] || []).length).map(ds => {
    const rr = mat.byDate[ds];
    return { ds, hadir: rr.filter(r => r.rec || r.rev).length, izin: rr.filter(r => !r.rec && (r.kat === 'izin' || r.kat === 'dinas')).length, alpha: rr.filter(r => r.kat === 'alpha').length };
  });
  if (!data.length) return emptyBox('Belum ada data harian pada periode ini.', 'chart');
  const bw = 16, gap = 7, base = 118, W = Math.max(360, data.length * (bw + gap) + 34), H = 140, max = Math.max(1, ...data.map(d => d.hadir + d.izin + d.alpha)), sc = (base - 14) / max, step = Math.ceil(data.length / 14);
  let bars = '';
  data.forEach((d, i) => {
    const x = 30 + i * (bw + gap); let y = base;
    [['hadir', '#7cb342', 'Hadir'], ['izin', '#facc15', 'Izin/Dinas'], ['alpha', '#ef4444', 'Alpha']].forEach(([k, c, t]) => {
      const h = d[k] * sc; if (!h) return; y -= h;
      bars += `<rect x="${x}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="3" fill="${c}"><title>${esc(fmtPendek(d.ds))} · ${t}: ${d[k]}</title></rect>`;
    });
    if (i % step === 0) bars += `<text x="${x + bw / 2}" y="${base + 14}" text-anchor="middle" font-size="9" fill="#6b7280">${+d.ds.slice(8)}</text>`;
  });
  return `${legendHtml([['Hadir', '#7cb342'], ['Izin / Dinas luar', '#facc15'], ['Alpha', '#ef4444']])}<div style="overflow:auto;margin-top:10px"><svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${Math.round(W * 1.7)}px;min-width:${Math.round(W * .75)}px;height:auto" role="img" aria-label="Tren kehadiran harian"><line x1="28" x2="${W - 4}" y1="${base}" y2="${base}" stroke="#d1d5db"/><text x="24" y="${base - max * sc + 4}" text-anchor="end" font-size="9" fill="#6b7280">${max}</text><text x="24" y="${base + 3}" text-anchor="end" font-size="9" fill="#6b7280">0</text>${bars}</svg></div>`;
}
const donutParts = sum => [
  { t: 'Tepat waktu', v: sum.tepat, c: '#7cb342' }, { t: 'Terlambat', v: sum.telat, c: '#f59e0b' }, { t: 'Tanpa absen masuk', v: sum.tanpaMasuk, c: '#fb923c' },
  { t: 'Izin / Sakit / Cuti', v: sum.izin, c: '#facc15' }, { t: 'Dinas luar', v: sum.dinas, c: '#60a5fa' }, { t: 'Alpha', v: sum.alpha, c: '#ef4444' }];
const sumAll = perGuru => perGuru.reduce((t, g) => { Object.keys(g.sum).forEach(k => { t[k] = (t[k] || 0) + g.sum[k]; }); return t; }, {});

function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = res; sc.onerror = () => rej(new Error('Pustaka Excel gagal dimuat. Periksa koneksi internet, atau gunakan file CSV.')); document.head.appendChild(sc);
  });
}
actions.csvTemplate = async () => {
  busy(true);
  try {
    await loadXlsx();
    const ws = XLSX.utils.aoa_to_sheet([['username', 'nama', 'nip', 'password'], ['guru.contoh', 'Nama Guru Contoh, S.Pd', '198001012005011001', 'rahasia123'], ['contoh@sekolah.sch.id', 'Guru Dengan Email', '', 'rahasia123']]);
    ['C2', 'C3', 'D2', 'D3'].forEach(c => { if (ws[c]) { ws[c].t = 's'; ws[c].z = '@'; } });   // NIP & password sebagai teks
    ws['!cols'] = [{ wch: 28 }, { wch: 34 }, { wch: 22 }, { wch: 16 }];
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Guru'); XLSX.writeFile(wb, 'template-guru.xlsx');
  } finally { busy(false); }

const splitCsv = (line, sep) => { const out = []; let cur = '', q = false; for (const ch of line) { if (ch === '"') q = !q; else if (ch === sep && !q) { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out.map(c => c.trim()); };
async function readSheetRows(file) {
  if (/\.xlsx?$/i.test(file.name)) {
    await loadXlsx();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' }), ws = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '', blankrows: false }).map(r => r.map(c => String(c ?? '').trim()));
  }
  const lines = (await file.text()).replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return [];
  const h = lines[0], sep = [';', '\t', ','].map(c => [c, h.split(c).length]).sort((a, b) => b[1] - a[1])[0][0];
  return lines.map(l => splitCsv(l, sep));
}
changes.csvImport = async t => {
  const file = t.files[0]; if (!file) return; t.value = '';
  busy(true); let ok = 0; const skipped = [], adjusted = [], nipWarn = [];
  try {
    const rows = await readSheetRows(file);
    if (!rows.length) throw new Error('File kosong.');
    let ix = { un: 0, nama: 1, nip: 2, pass: 3 }, start = 0;
    const hd = rows[0].map(c => c.toLowerCase());
    if (hd.some(c => /^(username|user|nama)$/.test(c))) {   // baris judul: petakan kolom berdasarkan namanya
      start = 1; const f = re => hd.findIndex(c => re.test(c));
      ix = { un: f(/^(username|user)$/), nama: f(/^nama/), nip: f(/^nip/), pass: f(/^(password|kata ?sandi|sandi)$/) };
      if (ix.un < 0 || ix.nama < 0 || ix.pass < 0) throw new Error('Judul kolom harus memuat: username, nama, nip (opsional), password.');
    }
    const seen = new Set();
    for (let i = start; i < rows.length; i++) {
      const r = rows[i], raw = r[ix.un] || '', nama = (r[ix.nama] || '').trim(), pass = r[ix.pass] || '';
      let nip = ix.nip >= 0 ? (r[ix.nip] || '').trim() : '';
      if (!raw && !nama) continue;
      const u = normUser(raw), why = !USER_RE.test(u) ? 'username tidak valid' : !nama ? 'nama kosong' : pass.length < 6 ? 'password kurang dari 6 karakter' : seen.has(u) ? 'username ganda di file' : (await DB.getUser(u)) ? 'username sudah terdaftar' : '';
      if (why) { skipped.push(`Baris ${i + 1} (${raw || '-'}): ${why}`); continue; }
      seen.add(u);
      if (/e\+/i.test(nip)) { nip = ''; nipWarn.push(nama); }
      if (u !== raw.trim().toLowerCase()) adjusted.push(`${raw} → ${u}`);
      await DB.saveUser(u, { username: u, nama, nip, passHash: await hashPass(u, pass), aktif: true, role: 'guru', createdAt: ymd(new Date()) }); ok++;
    }
  } catch (e) { busy(false); return toast(errMsg(e), 'err'); } finally { busy(false); }
  go('guru');
  const list = (title, a) => a.length ? `<div class="sm b" style="margin:12px 0 4px">${title} (${a.length})</div><div class="sm" style="max-height:160px;overflow:auto;background:#f8fafc;border-radius:12px;padding:8px 10px">${a.map(x => `<div>${esc(x)}</div>`).join('')}</div>` : '';
  modal('Hasil Impor', `<div class="kv"><span>Berhasil ditambahkan</span><span><b>${ok}</b></span><span>Dilewati</span><span><b>${skipped.length}</b></span></div>
    ${list('Dilewati', skipped)}${list('Username disesuaikan (gunakan ini untuk login)', adjusted)}${list('NIP terbaca sebagai angka ilmiah, isi manual di Data Guru', nipWarn)}`);
};

    ${notice('<b>Dinas luar:</b> guru dengan pengajuan Dinas Luar yang sudah Anda setujui otomatis memakai mode tanpa lokasi pada tanggal tersebut, dan tidak dikenai poin tanpa keterangan. Tidak perlu pengaturan manual.', 'info')}

function loadLeaflet() {
  if (window.L) return Promise.resolve();
  return new Promise((res, rej) => {
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(l);
    const s = document.createElement('script'); s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; s.onload = res; s.onerror = () => rej(new Error('Peta gagal dimuat')); document.head.appendChild(s);
  });
}
let mapObj = null;
async function setLokasi() {
  const c = cfgOrDefault();
  $('#setBody').innerHTML = `${c.modeAbsen === 'wfh' ? notice('Mode WFH sedang aktif, lokasi sekolah tidak dicek. Pengaturan ini berlaku kembali saat mode "Absen di Sekolah" diaktifkan.', 'info') : ''}<div class="card pad"><form data-form="saveLokasi" id="fLok">
    <label class="f" style="margin-top:0">Nama lokasi</label><input class="inp" name="namaLokasi" value="${esc(c.namaLokasi)}" required>
    <div id="map" class="map"><div class="empty">Memuat peta…</div></div>
    <p class="mut sm">Klik peta atau geser penanda untuk mengubah posisi sekolah. Lingkaran menunjukkan radius absensi.</p>
    <div class="grid2"><div><label class="f">Latitude</label><input class="inp" name="lat" inputmode="decimal" value="${c.lat}" required></div><div><label class="f">Longitude</label><input class="inp" name="lng" inputmode="decimal" value="${c.lng}" required></div></div>
    <label class="f">Radius absensi (meter)</label><input class="inp" type="number" name="radius" min="10" max="5000" value="${c.radius}" required>
    <label class="f">Tempel koordinat dari Google Maps (contoh: -6.2, 106.8)</label><input class="inp" id="pasteLL" placeholder="-6.200000, 106.816666">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button type="button" class="btn" data-act="useMyLoc">${ic('gps')} Gunakan lokasi saya sekarang</button><a class="btn" id="gmLink" target="_blank" rel="noopener" href="${mapsUrl(c.lat, c.lng)}">${ic('pin')} Buka di Google Maps</a></div>
    <button class="btn pri block lg" style="margin-top:18px">${ic('check')} Simpan Lokasi</button></form></div>`;
  const f = $('#fLok'); let marker, circle;
  const setPos = (lat, lng, pan = true) => {
    f.lat.value = (+lat).toFixed(6); f.lng.value = (+lng).toFixed(6); $('#gmLink').href = mapsUrl(f.lat.value, f.lng.value);
    if (marker) { marker.setLatLng([lat, lng]); circle.setLatLng([lat, lng]); if (pan) mapObj.setView([lat, lng], mapObj.getZoom()); }
  };
  window.__setLokasi = setPos;
  const fromInputs = () => { const la = parseFloat(f.lat.value), lo = parseFloat(f.lng.value); if (isFinite(la) && isFinite(lo)) setPos(la, lo); };
  f.lat.addEventListener('change', fromInputs); f.lng.addEventListener('change', fromInputs);
  f.radius.addEventListener('input', () => { if (circle) circle.setRadius(Number(f.radius.value) || 0); });
  $('#pasteLL').addEventListener('change', e => { const m = e.target.value.match(/(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)/); if (m) { setPos(+m[1], +m[2]); e.target.value = ''; } else toast('Format koordinat tidak dikenali.', 'err'); });
  try {
    await loadLeaflet();
    if (!$('#map')) return;
    $('#map').innerHTML = ''; mapObj = L.map('map').setView([c.lat, c.lng], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(mapObj);
    marker = L.marker([c.lat, c.lng], { draggable: true }).addTo(mapObj);
    circle = L.circle([c.lat, c.lng], { radius: c.radius, color: '#7cb342', fillOpacity: .15 }).addTo(mapObj);
    marker.on('dragend', () => { const p = marker.getLatLng(); setPos(p.lat, p.lng, false); circle.setLatLng(p); });
    mapObj.on('click', e => setPos(e.latlng.lat, e.latlng.lng));
    onLeave(() => { if (mapObj) { mapObj.remove(); mapObj = null; } });
  } catch (e) { const m = $('#map'); if (m) m.innerHTML = '<div class="empty">Peta tidak dapat dimuat. Isi koordinat secara manual.</div>'; }
}
actions.useMyLoc = async () => {
  busy(true);
  try { const p = await getPos(); window.__setLokasi(p.latitude, p.longitude); toast(`Posisi diambil (akurasi ±${Math.round(p.accuracy)} m).`); }
  catch (e) { toast(e.message, 'err'); } finally { busy(false); }
};
forms.saveLokasi = async f => {
  const lat = parseFloat(f.lat.value), lng = parseFloat(f.lng.value), radius = Number(f.radius.value);
  if (!(lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180)) return toast('Koordinat tidak valid.', 'err');
  if (!(radius >= 10 && radius <= 5000)) return toast('Radius harus 10–5000 meter.', 'err');
  busy(true);
  try { await saveCfgPart({ lat, lng, radius, namaLokasi: f.namaLokasi.value.trim() || 'Lokasi Sekolah' }); } finally { busy(false); }
  toast('Lokasi absensi disimpan.');
};

    <label class="f">Jenis</label><select class="inp" name="jenis"><option value="event">Agenda sekolah (hari tetap kerja)</option><option value="libur">Libur sekolah (tidak dihitung alpha)</option></select>

    <button class="btn pri block" style="margin-top:14px">${ic('plus')} Tambah</button></form></div>
  <div class="card"><div class="pad" style="padding-bottom:4px"><h3>Agenda Buatan Admin · ${y}</h3></div>${mine.length ? mine.map(l => `<div class="row"><div class="g"><b>${esc(l.ket)}</b><span>${esc(fmtPendek(l.mulai))}${l.selesai !== l.mulai ? ' – ' + esc(fmtPendek(l.selesai)) : ''} · ${l.jenis === 'event' ? 'Agenda sekolah' : 'Libur sekolah'}</span></div><button class="icon-btn" data-act="agDel" data-m="${esc(l.mulai)}" data-s="${esc(l.selesai)}" data-k="${esc(l.ket)}" aria-label="Hapus">${ic('trash')}</button></div>`).join('') : emptyBox('Belum ada agenda.', 'calendar')}</div>
  <div class="card pad"><h3>Hari Peringatan Nasional</h3><p class="mut sm">Hanya informasi di kalender, bukan libur: ${per}.</p></div>`;

actions.kalYearPrev = () => { S.kalYear--; setKalender(); };

/* =========================================================
   PWA (manifest Data URI + Service Worker dari Blob)
========================================================= */
function injectPWA() {
  try {
    if (!document.querySelector('link[rel="manifest"]')) {
      const icon = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#7cb342"/><path d="M256 120a96 96 0 0 0-96 96c0 72 96 176 96 176s96-104 96-176a96 96 0 0 0-96-96zm0 130a34 34 0 1 1 0-68 34 34 0 0 1 0 68z" fill="#fff"/></svg>');
      const man = { name: 'Absensi Guru', short_name: 'Absensi', start_url: location.href.split('#')[0], display: 'standalone', background_color: '#ffffff', theme_color: '#7cb342', icons: [{ src: icon, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }] };
      const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man)); document.head.appendChild(l);
    }
    if ('serviceWorker' in navigator) {
      const code = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));self.addEventListener('fetch',()=>{});";
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([code], { type: 'text/javascript' }))).catch(() => { });
    }
  } catch (e) { }
}
function injectFont() {
  try { if (document.querySelector('link[data-ag-font]')) return; const l = document.createElement('link'); l.rel = 'stylesheet'; l.dataset.agFont = '1'; l.href = 'https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap'; document.head.appendChild(l); } catch (e) { }
}

/* =========================================================
   BOOT
========================================================= */
(async function boot() {
  injectPWA(); injectFont();
  root.innerHTML = loading();
  try { DB = IS_PREVIEW ? await createMemDB() : await createFsDB(); }
  catch (e) { root.innerHTML = `<div class="login-wrap"><div class="card pad login-card">${notice('Gagal memuat Firebase: ' + esc(e.message) + '<br>Periksa firebaseConfig dan koneksi internet.')}</div></div>`; return; }
  try { S.sekolah = { nama: '', logo: '', ...((await DB.getSekolah()) || {}) }; } catch (e) { S.sekolah = { nama: '', logo: '' }; }
  applyTitle();
  DB.auth.onChange(async email => {
    if (email) { S.role = 'admin'; S.user = { email, nama: 'Administrator' }; S.cache = {}; await enterApp(); }
    else if (S.role !== 'guru') { S.role = null; S.user = null; renderLogin(); }
  });
})();
</script>
